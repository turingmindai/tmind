[project]
name = "turingmind-mcp"
version = "0.2.0"
description = "MCP server for TuringMind cloud sync - provides type-safe tools for authentication, code review uploads, and feedback"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "TuringMind", email = "support@turingmind.ai" }
]
keywords = ["mcp", "turingmind", "code-review", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
turingmind-mcp = "turingmind_mcp.server:main"

[project.urls]
Homepage = "https://turingmind.ai"
Documentation = "https://docs.turingmind.ai/mcp"
Repository = "https://github.com/turingmindai/tmind"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turingmind_mcp"]

